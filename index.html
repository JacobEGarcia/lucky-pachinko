  #poem{margin-top:11px;font-size:12px;letter-spacing:7px;color:#c8a060;opacity:.55;z-index:2;position:relative;text-align:center}

    body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(620px 340px at 7% 18%,rgba(255,140,60,.07),transparent 62%),
                 radial-gradient(620px 340px at 93% 78%,rgba(200,48,46,.08),transparent 62%)}
  }
  #mascot{position:absolute;right:-2px;top:-30px;width:70px;z-index:3;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  #mascot .mpaw{animation:mwave 1.1s ease-in-out infinite;transform-origin:62px 126px}
  @keyframes mwave{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
  .fever #mascot .mpaw{animation-duration:.28s}
  @media (prefers-reduced-motion:reduce){#mascot,#mascot .mpaw{animation:none}}

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
'use strict';
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const params=new URLSearchParams(location.search);
const SHOT=params.has('shot');
if(typeof Matter==='undefined'){
  document.body.innerHTML='<p style="color:#ffd28a;font-family:Georgia;text-align:center;margin-top:40vh">The machine could not wake its physics.<br>Check your connection and refresh.</p>';
  throw new Error('Matter.js failed to load');
}
const {Engine,Events,Bodies,Body,Composite}=Matter;

// ---------- board layout (physics units, 480x860, y down) ----------
const TW=480,TH=860;
const engine=Engine.create({enableSleeping:false});
engine.positionIterations=8;engine.velocityIterations=6;
const world=engine.world;
const WALL={isStatic:true,friction:.02,restitution:.5,label:'wall'};
function wallSeg(x1,y1,x2,y2,thick){
  const cx=(x1+x2)/2,cy=(y1+y2)/2,len=Math.hypot(x2-x1,y2-y1)+thick;
  const b=Bodies.rectangle(cx,cy,len,thick,WALL);
  Body.setAngle(b,Math.atan2(y2-y1,x2-x1));
  return b;
}
const walls=[];
walls.push(Bodies.rectangle(10,450,20,640,WALL));
walls.push(Bodies.rectangle(470,450,20,640,WALL));
const ARC={cx:240,cy:180,rx:230,ry:140},NARC=12;
for(let i=0;i<NARC;i++){
  const a0=Math.PI+i*Math.PI/NARC,a1=Math.PI+(i+1)*Math.PI/NARC;
  walls.push(wallSeg(ARC.cx+ARC.rx*Math.cos(a0),ARC.cy+ARC.ry*Math.sin(a0),ARC.cx+ARC.rx*Math.cos(a1),ARC.cy+ARC.ry*Math.sin(a1),22));
}
walls.push(wallSeg(10,140,10,180,22));walls.push(wallSeg(470,140,470,180,22));
walls.push(Bodies.rectangle(427,520,12,640,WALL));
walls.push(Bodies.rectangle(447,844,42,16,WALL));
const POCKET_X=[16,74.6,133.1,191.7,250.3,308.9,367.4,426];
for(let k=1;k<7;k++)walls.push(Bodies.rectangle(POCKET_X[k],816,12,88,WALL));
walls.push(Bodies.rectangle(240,856,480,16,WALL));
Composite.add(world,walls);

const PEGS=[];
for(let row=0;row<9;row++){
  const y=240+row*60;
  for(let col=0;col<7;col++){
    const x=44+col*58+(row%2?29:0);
    if(x>398)continue;
    PEGS.push({x,y});
  }
}
PEGS.push({x:166,y:420},{x:314,y:420},{x:36,y:330},{x:44,y:470},{x:36,y:600});
PEGS.forEach(p=>{
  const b=Bodies.circle(p.x,p.y,7,{isStatic:true,restitution:.62,friction:0,label:'peg'});
  Composite.add(world,b);p.body=b;
});
const BELL={x:240,y:420,body:Bodies.circle(240,420,16,{isStatic:true,restitution:.6,friction:0,label:'bell'}),flash:0};
Composite.add(world,BELL.body);

const POCKET_DEFS=[
  {ch:'凶',pay:0},{ch:'半吉',pay:2},{ch:'吉',pay:5},{ch:'大吉',pay:10},{ch:'吉',pay:5},{ch:'半吉',pay:2},{ch:'凶',pay:0}
];
const pockets=POCKET_DEFS.map((d,k)=>{
  const cx=(POCKET_X[k]+POCKET_X[k+1])/2;
  const b=Bodies.rectangle(cx,838,POCKET_X[k+1]-POCKET_X[k]-10,20,{isStatic:true,isSensor:true,label:'pocket'});
  Composite.add(world,b);
  return {...d,cx,body:b,flash:0};
});

// ---------- state (declared before fire) ----------
let stock=25,score=0,best=0,jackpots=0,feverT=0;
try{best=parseInt(localStorage.getItem('pachBest')||'0',10)||0;}catch(e){}
document.getElementById('best').textContent=best;
function saveBest(){try{localStorage.setItem('pachBest',String(best));}catch(e){}}

let balls=[];
function fireBall(power){
  if(stock<=0)return false;
  stock--;document.getElementById('stock').textContent=stock;
  const b=Bodies.circle(447,830,9,{density:.02,friction:.01,frictionAir:.0012,restitution:.55,label:'ball'});
  Composite.add(world,b);
  balls.push(b);
  Body.setVelocity(b,{x:0,y:-(13+power*13)});
  if(balls.length>42){const old=balls.shift();Composite.remove(world,old);}
  return true;
}

// ---------- audio ----------
let actx=null;
function tone(f,d,type,g,when){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime+(when||0);
    const o=actx.createOscillator(),v=actx.createGain();
    o.type=type;o.frequency.value=f;
    v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g,t0+.01);v.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(v).connect(actx.destination);o.start(t0);o.stop(t0+d+.05);
  }catch(e){}
}
const PENTA=[523,587,659,784,880,1046,1174];
function plink(y){const i=Math.max(0,Math.min(6,((y-200)/70)|0));tone(PENTA[6-i]*2,.08,'triangle',.03);}
function pocketChord(pay){
  if(pay>=10)[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.06));
  else if(pay>=5)[659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.1,i*.05));
  else if(pay>=2)tone(880,.15,'triangle',.08);
  else tone(140,.35,'sine',.09);
}

// ---------- presentation (declared before scoring FX) ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,480/860,1,4000);
camera.position.set(0,975,855);camera.lookAt(0,0,20);
scene.add(new THREE.AmbientLight(0xffd9b0,.7));
const key=new THREE.DirectionalLight(0xfff0dd,.9);key.position.set(-200,700,300);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
const sc=key.shadow.camera;sc.left=-400;sc.right=400;sc.top=600;sc.bottom=-600;sc.far=2200;scene.add(key);
const rim=new THREE.PointLight(0xc8302e,1.5,1200);rim.position.set(300,300,-300);scene.add(rim);
const glowP=new THREE.PointLight(0xffd24a,.8,900);glowP.position.set(0,200,200);scene.add(glowP);

let composer=null;
try{
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(480,860),.55,.8,.78));
  composer.addPass(new OutputPass());
}catch(e){composer=null;}

function px(x){return x-TW/2;}
function pz(y){return y-TH/2;}

function seigaihaTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=960;const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,960);grd.addColorStop(0,'#6a1420');grd.addColorStop(.5,'#4a0e18');grd.addColorStop(1,'#300810');
  g.fillStyle=grd;g.fillRect(0,0,512,960);
  g.strokeStyle='rgba(255,210,120,.10)';g.lineWidth=2;
  for(let row=0;row<14;row++)for(let col=-1;col<8;col++){
    const x=col*74+(row%2?37:0),y=row*74;
    for(const r of[16,28,40]){g.beginPath();g.arc(x,y,r,Math.PI,2*Math.PI);g.stroke();}
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const MAT_RED=new THREE.MeshStandardMaterial({color:0x8e1f1f,roughness:.5,metalness:.15});
const MAT_GOLD=new THREE.MeshStandardMaterial({color:0xd8a838,roughness:.3,metalness:.7});
const field=new THREE.Mesh(new THREE.BoxGeometry(TW,24,TH),new THREE.MeshStandardMaterial({map:seigaihaTexture(),roughness:.45,metalness:.1}));
field.position.y=-12;field.receiveShadow=true;scene.add(field);
const trim=[[0,-TH/2+6,TW-40,8],[0,TH/2-6,TW-40,8],[-TW/2+6,0,8,TH-40],[TW/2-6,0,8,TH-40]];
for(const[x,z,w,d]of trim){const m=new THREE.Mesh(new THREE.BoxGeometry(w,10,d),MAT_GOLD);m.position.set(x,2,z);scene.add(m);}
for(const w of walls){
  const wdt=w.bounds.max.x-w.bounds.min.x,hgt=w.bounds.max.y-w.bounds.min.y;
  const m=new THREE.Mesh(new THREE.BoxGeometry(wdt,26,hgt),MAT_RED);
  m.position.set(px(w.position.x),13,pz(w.position.y));m.rotation.y=-w.angle;m.castShadow=true;scene.add(m);
}
const pegGeo=new THREE.CylinderGeometry(7,8,22,12);
const pegMeshes=PEGS.map(p=>{
  const m=new THREE.Mesh(pegGeo,new THREE.MeshStandardMaterial({color:0xd8a838,metalness:.8,roughness:.25,emissive:0x000000}));
  m.position.set(px(p.x),11,pz(p.y));m.castShadow=true;scene.add(m);return m;
});
const bellMesh=new THREE.Mesh(new THREE.SphereGeometry(16,24,18),new THREE.MeshStandardMaterial({color:0xffd24a,metalness:.9,roughness:.2,emissive:0x553300}));
bellMesh.position.set(px(BELL.x),14,pz(BELL.y));bellMesh.castShadow=true;scene.add(bellMesh);
const bellRing=new THREE.Mesh(new THREE.TorusGeometry(22,2.4,10,32),MAT_RED);
bellRing.rotation.x=Math.PI/2;bellRing.position.set(px(BELL.x),8,pz(BELL.y));scene.add(bellRing);
function kanjiPlane(ch,w){
  const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');
  g.fillStyle='#ffd24a';g.font=(ch.length>1?'700 34px':'700 44px')+' Georgia';g.textAlign='center';g.fillText(ch,64,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w||46,23),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  m.rotation.x=-Math.PI/2+.62;return m;
}
const pocketMeshes=pockets.map(p=>{
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(POCKET_X[1]-POCKET_X[0]-16,6,16),
    new THREE.MeshStandardMaterial({color:p.pay>=10?0xc8302e:p.pay>=5?0xd8a838:0x8e1f1f,emissive:0x000000}));
  lamp.position.set(px(p.cx),10,pz(842));scene.add(lamp);
  const lab=kanjiPlane(p.ch);lab.position.set(px(p.cx),22,pz(798));scene.add(lab);
  return lamp;
});
function backboardTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#2e1420';g.fillRect(0,0,512,128);
  g.strokeStyle='#c8a060';g.lineWidth=3;g.strokeRect(6,6,500,116);
  g.fillStyle='#f0d8a8';g.font='40px Georgia';g.textAlign='center';
  g.fillText('福  LUCKY PACHINKO  福',256,64);
  g.fillStyle='#c8a060';g.font='15px Georgia';
  g.fillText('the cat pays out, the cat always pays out',256,98);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const backboard=new THREE.Mesh(new THREE.BoxGeometry(360,96,10),new THREE.MeshStandardMaterial({map:backboardTexture(),roughness:.6}));
backboard.position.set(0,66,-536);backboard.rotation.x=-.12;scene.add(backboard);
function catFigurine(s){
  const g=new THREE.Group();
  const cream=new THREE.MeshStandardMaterial({color:0xfff8ee,roughness:.28});
  const body=new THREE.Mesh(new THREE.SphereGeometry(10*s,20,16),cream);body.scale.set(1,1.25,1);g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(8*s,20,16),cream);head.position.y=15*s;g.add(head);
  const eL=new THREE.Mesh(new THREE.ConeGeometry(3*s,5*s,4),cream);eL.position.set(-5*s,21*s,0);g.add(eL);
  const eR=eL.clone();eR.position.x=5*s;g.add(eR);
  const collar=new THREE.Mesh(new THREE.TorusGeometry(7*s,1.6*s,8,20),new THREE.MeshStandardMaterial({color:0xc8302e}));collar.rotation.x=Math.PI/2;collar.position.y=9*s;g.add(collar);
  const bell=new THREE.Mesh(new THREE.SphereGeometry(2*s,10,8),MAT_GOLD);bell.position.set(0,7*s,7*s);g.add(bell);
  const paw=new THREE.Mesh(new THREE.SphereGeometry(3.4*s,12,10),cream);paw.position.set(7*s,17*s,2*s);g.add(paw);
  return g;
}
const catFig=catFigurine(2.2);catFig.position.set(150,122,-526);scene.add(catFig);

function kobanTexture(){
  const c=document.createElement('canvas');c.width=128;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#ffd24a';g.fillRect(0,0,128,128);
  g.strokeStyle='#b8860b';g.lineWidth=6;g.strokeRect(8,8,112,112);
  g.fillStyle='#8e1f1f';g.font='64px Georgia';g.textAlign='center';g.fillText('福',64,88);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const ballMat=new THREE.MeshStandardMaterial({map:kobanTexture(),metalness:.7,roughness:.25,emissive:0x221100});
const ballGeo=new THREE.CylinderGeometry(9,9,6,20);
const ballMeshes=new Map();
function syncBallMeshes(){
  for(const b of balls){
    if(!ballMeshes.has(b)){const m=new THREE.Mesh(ballGeo,ballMat);m.castShadow=true;scene.add(m);ballMeshes.set(b,m);}
    const m=ballMeshes.get(b);
    m.position.set(px(b.position.x),9,pz(b.position.y));
    m.rotation.y+=b.velocity.x*.02;
  }
  for(const[b,m]of ballMeshes)if(!balls.includes(b)){scene.remove(m);ballMeshes.delete(b);}
}
let floaters=[];
function floatText(x,y,txt){
  const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');
  g.fillStyle='#ffd24a';g.font='700 40px Georgia';g.textAlign='center';g.fillText(txt,64,46);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));
  s.position.set(px(x),30,pz(y));s.scale.set(56,28,1);scene.add(s);
  floaters.push({s,t:.9});
}
let bursts=[];
function burst(x,y,n){
  if(!n)return;
  const pos=new Float32Array(n*3),vel=[];
  for(let i=0;i<n;i++){
    pos[i*3]=px(x);pos[i*3+1]=20;pos[i*3+2]=pz(y);
    const a=Math.random()*6.28,v=2+Math.random()*5;
    vel.push([Math.cos(a)*v,3+Math.random()*4,Math.sin(a)*v]);
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0xffd24a,size:7,transparent:true,opacity:1});
  const pts=new THREE.Points(geo,mat);scene.add(pts);
  bursts.push({pts,vel,t:1.5});
}
// ---------- ball trails (visual only; physics untouched) ----------
const TRAIL_MAX=720;
const trailPos=new Float32Array(TRAIL_MAX*3);
const trailLife=new Float32Array(TRAIL_MAX);
for(let i=0;i<TRAIL_MAX;i++)trailPos[i*3+1]=-200;
const trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));
const trailPts=new THREE.Points(trailGeo,new THREE.PointsMaterial({color:0xffe2a0,size:3.2,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
trailPts.frustumCulled=false;scene.add(trailPts);
let trailHead=0;
function trailTick(dt){
  for(const b of balls){
    const s=Math.hypot(b.velocity.x,b.velocity.y);
    if(s>8){
      const i=trailHead;trailHead=(trailHead+1)%TRAIL_MAX;
      trailPos[i*3]=px(b.position.x);trailPos[i*3+1]=9;trailPos[i*3+2]=pz(b.position.y);
      trailLife[i]=.3;
    }
  }
  for(let i=0;i<TRAIL_MAX;i++){if(trailLife[i]>0){trailLife[i]-=dt;if(trailLife[i]<=0)trailPos[i*3+1]=-200;}}
  trailGeo.attributes.position.needsUpdate=true;
}

// ---------- koban rain on jackpot (visual only) ----------
let rain=[];
function kobanRain(){
  for(let i=0;i<22;i++){
    const m=new THREE.Mesh(ballGeo,ballMat);
    m.position.set((Math.random()-.5)*420,120+Math.random()*220,-430-Math.random()*60);
    m.rotation.z=(Math.random()-.5)*.6;m.castShadow=true;scene.add(m);
    rain.push({m,vy:-(2+Math.random()*3),vr:(Math.random()-.5)*4,t:1.6});
  }
}
function rainTick(dt){
  for(let i=rain.length-1;i>=0;i--){
    const r=rain[i];r.t-=dt;
    r.m.position.y+=r.vy*dt*60;r.vy-=dt*3;
    if(r.m.position.y<8){r.m.position.y=8;r.vy*=-.3;}
    r.m.rotation.y+=r.vr*dt;
    if(r.t<=0){scene.remove(r.m);rain.splice(i,1);}
  }
}

function addScore(n,x,y){
  score+=n*(feverT>0?2:1);
  document.getElementById('score').textContent=score;
  if(score>best){best=score;saveBest();document.getElementById('best').textContent=best;}
  if(n>0)floatText(x,y,'+'+n*(feverT>0?2:1));
}
function bark(t){
  const b=document.getElementById('bark');b.textContent=t;b.style.display='block';
  clearTimeout(bark._t);bark._t=setTimeout(()=>b.style.display='none',2400);
}

// ---------- collisions ----------
let pegFlash=new Map();
Events.on(engine,'collisionStart',ev=>{
  for(const p of ev.pairs){
    const ballB=p.bodyA.label==='ball'?p.bodyA:(p.bodyB.label==='ball'?p.bodyB:null);
    if(!ballB)continue;
    const other=p.bodyA===ballB?p.bodyB:p.bodyA;
    if(other.label==='peg'){
      const peg=PEGS.find(g=>g.body===other);
      if(peg){pegFlash.set(peg,1);plink(other.position.y);}
    }else if(other.label==='bell'){
      if(BELL.flash<=0){
        stock+=1;document.getElementById('stock').textContent=stock;
        tone(1760,.4,'sine',.1);tone(880,.3,'sine',.08,.1);
        burst(BELL.x,BELL.y,30);
      }
      BELL.flash=1;
    }else if(other.label==='pocket'){
      const pk=pockets.find(q=>q.body===other);
      const i=balls.indexOf(ballB);if(i>=0)balls.splice(i,1);
      Composite.remove(world,ballB);
      pk.flash=1;
      stock+=pk.pay;document.getElementById('stock').textContent=stock;
      addScore(pk.pay,pk.cx,820);
      pocketChord(pk.pay);
      burst(pk.cx,830,pk.pay>=10?60:pk.pay>=5?30:0);
      if(pk.pay>=10){
        jackpots++;document.getElementById('jp').textContent=jackpots;
        shake=.8;
        kobanRain();
        if(jackpots%3===0&&feverT<=0){
          feverT=20;document.body.classList.add('fever');document.getElementById('feverBadge').style.display='inline';
          bark('FEVER. The paw cannot stop.');
        }else bark('大吉. The cat howls.');
      }
      if(stock<=0&&balls.length===0)setTimeout(()=>{document.getElementById('shareBtn').click();},1200);
    }
  }
});

// ---------- input ----------
let charging=false,charge=0,autoFire=0;
const fireBtn=document.getElementById('fireBtn');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();charging=true;});
addEventListener('pointerup',()=>{if(charging){charging=false;fireBall(charge);charge=0;}});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();charging=true;}});
addEventListener('keyup',e=>{if(e.code==='Space'){charging=false;fireBall(charge);charge=0;}});

// ---------- main loop ----------
let shake=0,t0=performance.now();
function step(now){
  const dt=Math.min((now-t0)/1000,.034);t0=now;
  if(charging){
    charge=Math.min(1,charge+dt*.8);
    autoFire-=dt;
    if(charge>=1&&autoFire<=0){autoFire=.32;fireBall(1);}
  }
  Engine.update(engine,dt*500);Engine.update(engine,dt*500);
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i],v=b.velocity,s=Math.hypot(v.x,v.y);
    if(s>22)Body.setVelocity(b,{x:v.x/s*22,y:v.y/s*22});
    if(b.position.y>900||b.position.x<-30||b.position.x>510){Composite.remove(world,b);balls.splice(i,1);}
  }
  if(feverT>0){
    feverT-=dt;
    glowP.intensity=1.6+Math.sin(now/90)*1.2;
    if(feverT<=0){document.body.classList.remove('fever');document.getElementById('feverBadge').style.display='none';glowP.intensity=.8;}
  }
  syncBallMeshes();
  trailTick(dt);
  rainTick(dt);
  for(const[peg,f]of pegFlash){
    const m=pegMeshes[PEGS.indexOf(peg)];
    if(f>.15){pegFlash.set(peg,f-dt*4);m.material.emissive.setHex(0xcc8800);}
    else{pegFlash.delete(peg);m.material.emissive.setHex(0x000000);}
  }
  if(BELL.flash>0){BELL.flash-=dt*2;bellMesh.material.emissive.setHex(0xaa7700);}else bellMesh.material.emissive.setHex(0x553300);
  for(let i=0;i<pockets.length;i++){
    const pk=pockets[i];
    if(pk.flash>0){pk.flash-=dt*2;pocketMeshes[i].material.emissive.setHex(0xffd24a);}
    else pocketMeshes[i].material.emissive.setHex(0x000000);
  }
  catFig.rotation.y=Math.sin(now/1400)*.3;
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.t-=dt*1.2;f.s.position.y+=dt*40;f.s.material.opacity=Math.max(0,f.t);
    if(f.t<=0){scene.remove(f.s);floaters.splice(i,1);}
  }
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.t-=dt;
    const p=b.pts.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){
      p.array[j*3]+=b.vel[j][0];p.array[j*3+1]+=b.vel[j][1];p.array[j*3+2]+=b.vel[j][2];
      b.vel[j][1]-=dt*8;
    }
    p.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.t/1.5);
    if(b.t<=0){scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}
  }
  if(shake>0){shake-=dt;const s=shake*6;canvas.style.transform='translate('+(Math.random()-.5)*s+'px,'+(Math.random()-.5)*s+'px)';}
  else canvas.style.transform='';
  if(composer)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(step);
}
function resize(){
  const r=canvas.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  if(composer)composer.setSize(r.width,r.height);
  camera.aspect=r.width/r.height;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();
requestAnimationFrame(step);
if(SHOT){let n=0;const iv=setInterval(()=>{fireBall(.55+Math.random()*.45);if(++n>=10)clearInterval(iv);},380);}
</script>
</body>
</html>
